<!DOCTYPE html>
<html lang="vi">
<head>
<script src="../js/security.js?v=20260415"></script>
<script src="../js/cloudflare-loader.js?v=20260415"></script>
<meta charset="UTF-8">
<title data-en="Release history – MemDeck">Lịch sử phiên bản – MemDeck</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Các bản cập nhật của plugin MemDeck." data-en-content="Release notes for the MemDeck plugin.">
<meta name="theme-color" content="#f4f1ea">
<link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css?v=20260403">
<link rel="stylesheet" href="../css/site.css?v=20261112">
<script src="../js/i18n.js?v=20261112"></script>
<script src="../js/include.js?v=20261112"></script>
</head>
<body class="mx">
<div id="header-placeholder"></div>
<main>
<section class="page-hero">
    <div class="wrap reveal">
        <span class="eyebrow" data-en="Versions">Phiên bản</span>
        <h1 data-en="What’s <em class=&quot;hl&quot;>new</em>">Có gì <em class="hl">mới</em></h1>
        <p class="lead" data-en="Every MemDeck update. The plugin checks for updates by itself and installs them in Settings.">Tất cả các bản cập nhật của MemDeck. Plugin tự kiểm tra bản mới và cập nhật ngay trong phần Cài đặt.</p>
    </div>
</section>
<section class="sec v-sec">
    <div class="wrap">
        <div class="v-latest" id="vLatest"><div class="v-loading" data-en="Loading…">Đang tải…</div></div>
        <div class="v-list" id="vList"></div>
    </div>
</section>
</main>
<div id="footer-placeholder"></div>
<script src="../js/site.js?v=20261112"></script>
<script>
(function () {
    var data = null;
    var L = function () { return window.MD_LANG === 'en' ? 'en' : 'vi'; };
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
    var md = function (s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); };
    // trường song ngữ: dùng xxx_en khi xem tiếng Anh, không có thì dùng bản tiếng Việt
    function f(o, k) { return (L() === 'en' && o[k + '_en']) ? o[k + '_en'] : o[k]; }
    function T(vi, en) { return L() === 'en' ? en : vi; }
    function vnum(v) { return /^ver/i.test(v) ? v : 'v' + v; }
    function feats(v) {
        return (v.features || []).map(function (x) {
            var d = f(x, 'description'); d = Array.isArray(d) ? d : (d ? [d] : []);
            return '<li><b>' + md(f(x, 'title')) + '</b>' + (d.length ? '<ul>' + d.map(function (y) { return '<li>' + md(y) + '</li>'; }).join('') + '</ul>' : '') + '</li>';
        }).join('');
    }
    function render() {
        if (!data) return;
        var latest = data.find(function (v) { return v.isLatest; }) || data[0];
        document.getElementById('vLatest').innerHTML = latest ?
            '<div class="v-hero"><div><span class="v-tag">' + T('Mới nhất', 'Latest') + '</span><h2>' + esc(vnum(latest.version)) + '</h2>' +
            '<p class="v-date">' + esc(f(latest, 'date')) + '</p><h3>' + md(f(latest, 'title')) + '</h3><p>' + md(f(latest, 'description')) + '</p></div>' +
            '<div class="v-hero-cta"><a class="btn btn-light" href="guide.html#download">' + T('Tải bản mới nhất', 'Download the latest') + '</a>' +
            '<a class="btn btn-outline-light" href="#v' + esc(latest.version) + '">' + T('Xem chi tiết', 'See details') + '</a></div></div>' : '';
        document.getElementById('vList').innerHTML = data.map(function (v) {
            return '<article class="v-item" id="v' + esc(v.version) + '"><div class="v-dot"></div><div class="v-card">' +
                '<div class="v-top"><h3>' + esc(vnum(v.version)) + '</h3><span>' + esc(f(v, 'date')) + (v.isLatest ? ' · ' + T('Mới nhất', 'Latest') : '') + '</span></div>' +
                '<h4>' + md(f(v, 'title')) + '</h4>' + (f(v, 'description') ? '<p>' + md(f(v, 'description')) + '</p>' : '') +
                (feats(v) ? '<ul class="v-feats">' + feats(v) + '</ul>' : '') + '</div></article>';
        }).join('');
    }
    function load(urls) {
        var u = urls.shift();
        return fetch(u + '?v=' + Date.now()).then(function (r) { if (!r.ok) throw 0; return r.json(); })
            .catch(function (e) { if (urls.length) return load(urls); throw e; });
    }
    load(['../json/version.json', '../json/Version.json']).then(function (j) {
        data = (j.versions || []).slice().sort(function (a, b) {
            var x = String(a.version).replace(/[^\d.]/g, '').split('.').map(Number), y = String(b.version).replace(/[^\d.]/g, '').split('.').map(Number);
            for (var i = 0; i < Math.max(x.length, y.length); i++) { if ((y[i] || 0) !== (x[i] || 0)) return (y[i] || 0) - (x[i] || 0); }
            return 0;
        });
        render();
    }).catch(function () {
        document.getElementById('vLatest').innerHTML = '<div class="v-loading">' + T('Chưa tải được lịch sử phiên bản.', 'Could not load the release history.') + '</div>';
    });
    document.addEventListener('md:lang', render);
})();
</script>
</body>
</html>
